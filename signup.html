<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <div class="logo">FinWise</div>
      <button class="nav-btn">Sign Up</button>
    </div>

    <div class="form-box">
      <h2>Sign Up To Get<br><span>Started</span></h2>
      <form>
        <label>Email Address</label>
        <input type="email" placeholder="">

        <label>Password</label>
        <div class="password-box">
          <input type="password" placeholder="">
          <span class="eye-icon">👁</span>
        </div>

        <label>Confirm Password</label>
        <div class="password-box">
          <input type="password" placeholder="">
          <span class="eye-icon">👁</span>
        </div>

        <button type="submit" class="submit-btn">Sign Up</button>
      </form>
      <p class="login-link">Already have an account? <a href="https://Moses-John-1.github.io/Finewise/login.html">Log In</a></p>
    </div>
  </div>
</body>
</html>
